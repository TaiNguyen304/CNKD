<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chiếc Nón Kỳ Diệu - Đăng Nhập Người Chơi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/disableDevTools.js"></script>
  <style>
    * {
      font-weight: bold !important;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at center, #0a2540 0%, #031120 70%, #01060d 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 16px;
      user-select: none;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.92);
      border: 3px solid #f59e0b;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 30px rgba(245, 158, 11, 0.25);
    }

    .input-field {
      background: #0f172a;
      border: 2px solid #334155;
      color: #ffffff;
      transition: all 0.2s;
    }
    .input-field:focus {
      outline: none;
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25);
      background: #1e293b;
    }

    .btn-submit {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #020617;
      box-shadow: 0 10px 20px -5px rgba(245, 158, 11, 0.5);
      transition: all 0.15s;
    }
    .btn-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      transform: translateY(-2px);
      box-shadow: 0 15px 25px -5px rgba(245, 158, 11, 0.6);
    }
    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="w-full max-w-md glass-panel rounded-2xl p-6 sm:p-8 relative">
    <!-- Header / Logo -->
    <div class="text-center mb-6">
      <div class="inline-block px-4 py-1.5 bg-amber-500/20 border border-amber-500/50 text-amber-300 text-xs tracking-wider uppercase mb-2 rounded-full">
        CHIẾC NÓN KỲ DIỆU
      </div>
      <h1 class="text-2xl sm:text-3xl text-amber-400 uppercase tracking-tight">
        Đăng Nhập Người Chơi
      </h1>
      <p class="text-xs text-slate-400 mt-1">
        Vui lòng chọn vị trí và nhập đúng mã phòng cùng mật khẩu
      </p>
    </div>

    <!-- Error / Toast Banner (Zero alert/prompt/confirm) -->
    <div id="errorBanner" class="hidden mb-5 p-3.5 bg-rose-950/80 border-2 border-rose-600 rounded-xl text-rose-200 text-xs flex items-center justify-between gap-2 shadow-lg">
      <div class="flex items-center gap-2">
        <span class="text-rose-400 text-base">⚠️</span>
        <span id="errorMessage">Thông tin đăng nhập không chính xác</span>
      </div>
      <button type="button" onclick="hideError()" class="text-rose-400 hover:text-rose-200 text-sm p-1">✕</button>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <!-- Ô thứ nhất: Chọn vị trí từ 1 - 3 -->
      <div>
        <label for="playerSlot" class="block text-xs uppercase tracking-wider text-slate-300 mb-1.5">
          1. Vị trí người chơi (1 - 3)
        </label>
        <div class="relative">
          <select id="playerSlot" required class="input-field w-full px-4 py-3 rounded-xl text-sm appearance-none cursor-pointer">
            <option value="" disabled selected>-- Chọn vị trí người chơi --</option>
            <option value="1">Vị trí 1 (Người chơi 1 - Đỏ)</option>
            <option value="2">Vị trí 2 (Người chơi 2 - Vàng)</option>
            <option value="3">Vị trí 3 (Người chơi 3 - Xanh)</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
            ▼
          </div>
        </div>
      </div>

      <!-- Ô thứ hai: Nhập mã phòng (6 chữ số) -->
      <div>
        <label for="roomIdInput" class="block text-xs uppercase tracking-wider text-slate-300 mb-1.5">
          2. Mã phòng (6 chữ số)
        </label>
        <input
          type="text"
          id="roomIdInput"
          name="roomId"
          required
          maxlength="6"
          pattern="[0-9]{6}"
          inputmode="numeric"
          placeholder="Ví dụ: 849201"
          class="input-field w-full px-4 py-3 rounded-xl text-sm tracking-widest placeholder:text-slate-500 font-mono"
        />
      </div>

      <!-- Ô thứ ba: Nhập mật khẩu (4 chữ số) -->
      <div>
        <label for="authPassInput" class="block text-xs uppercase tracking-wider text-slate-300 mb-1.5">
          3. Mật khẩu (4 chữ số)
        </label>
        <input
          type="password"
          id="authPassInput"
          name="auth"
          required
          maxlength="4"
          pattern="[0-9]{4}"
          inputmode="numeric"
          placeholder="Ví dụ: 1234"
          class="input-field w-full px-4 py-3 rounded-xl text-sm tracking-widest placeholder:text-slate-500 font-mono"
        />
      </div>

      <!-- Nút Xác nhận -->
      <div class="pt-2">
        <button
          type="submit"
          id="submitBtn"
          class="btn-submit w-full py-3.5 px-6 rounded-xl text-base uppercase tracking-wider cursor-pointer flex items-center justify-center gap-2"
        >
          <span id="btnText">Xác nhận</span>
        </button>
      </div>
    </form>
  </div>

  <script>
    function showError(msg) {
      const banner = document.getElementById('errorBanner');
      const text = document.getElementById('errorMessage');
      text.innerText = msg;
      banner.classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('errorBanner').classList.add('hidden');
    }

    async function handleLogin(event) {
      event.preventDefault();
      hideError();

      const slot = document.getElementById('playerSlot').value;
      const roomId = document.getElementById('roomIdInput').value.trim();
      const auth = document.getElementById('authPassInput').value.trim();

      if (!slot || !roomId || !auth) {
        showError('Vui lòng điền đầy đủ cả 3 thông tin!');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      submitBtn.disabled = true;
      btnText.innerText = 'Đang kiểm tra...';

      try {
        const response = await fetch('/api/room/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ roomId, slot: Number(slot), auth })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          // Đúng vị trí, đúng mã phòng và đúng mật khẩu
          btnText.innerText = 'Đang chuyển hướng...';
          const targetUrl = `/Player${slot}.html?roomid=${encodeURIComponent(roomId)}&auth=${encodeURIComponent(auth)}`;
          window.location.href = targetUrl;
        } else {
          showError(data.message || 'Mã phòng hoặc mật khẩu không chính xác!');
          submitBtn.disabled = false;
          btnText.innerText = 'Xác nhận';
        }
      } catch (err) {
        showError('Không thể kết nối đến máy chủ. Vui lòng thử lại!');
        submitBtn.disabled = false;
        btnText.innerText = 'Xác nhận';
      }
    }
  </script>
</body>
</html>
